<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Balance</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Balance" />
    <meta name="description" content="Tu dinero, junto en un solo sitio." />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <style>
      html, body { margin: 0; background: #f6f3ee; }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #f6f3ee;
        color: #1c1915;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      #boot::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 16rem;
        pointer-events: none;
        background: radial-gradient(ellipse at top, rgba(255, 252, 246, 0.95), transparent 70%);
      }
      #boot.is-done { opacity: 0; transition: opacity 680ms cubic-bezier(0.22, 1, 0.36, 1); pointer-events: none; }
      .boot-card { position: relative; text-align: center; animation: boot-in 780ms cubic-bezier(0.22, 1, 0.36, 1) both; }
      .boot-mark {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        margin: 0 auto;
        border-radius: 1.15rem;
        background: #ffffff;
        color: #111111;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.08), 0 12px 28px rgba(0, 0, 0, 0.08);
        animation: boot-breathe 2.2s ease-in-out infinite;
      }
      .boot-name {
        margin: 16px 0 0;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #8a8175;
      }
      .boot-line {
        display: block;
        width: 36px;
        height: 1px;
        margin: 18px auto 0;
        background: currentColor;
        transform-origin: center;
        animation: boot-line 1.8s ease-in-out infinite;
      }
      @keyframes boot-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes boot-breathe {
        0%, 100% { transform: scale(0.985); }
        50% { transform: scale(1); }
      }
      @keyframes boot-line {
        0%, 100% { transform: scaleX(0.28); opacity: 0.16; }
        50% { transform: scaleX(1); opacity: 0.42; }
      }
      @media (prefers-color-scheme: dark) {
        html, body, #boot { background: #0c0b0a; color: #f6f1e8; }
        #boot::before { background: radial-gradient(ellipse at top, rgba(232, 214, 180, 0.16), transparent 62%); }
        .boot-name { color: #a89880; }
      }
      html.dark, html.dark body, html.dark #boot { background: #0c0b0a; color: #f6f1e8; }
      html.dark #boot::before { background: radial-gradient(ellipse at top, rgba(232, 214, 180, 0.16), transparent 62%); }
      html.dark .boot-name { color: #a89880; }
      @media (prefers-reduced-motion: reduce) {
        .boot-card, .boot-mark, .boot-line { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-card">
        <span class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Cargando</span>
        <div class="boot-mark">
          <svg width="22" height="22" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 6.5v18.5M12 25h8M5.5 9.5h21"/>
              <path d="M8 9.5 5.4 16c.75.75 1.8 1.15 2.6 1.15S10 16.75 10.6 16L8 9.5z"/>
              <path d="M24 9.5 21.4 16c.75.75 1.8 1.15 2.6 1.15s1.85-.4 2.6-1.15L24 9.5z"/>
            </g>
          </svg>
        </div>
        <p class="boot-name">Balance</p>
        <span class="boot-line"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
